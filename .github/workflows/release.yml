# Builds LootRadarSetup.exe and attaches it to a GitHub Release when the release is published.
# Installed copies of Loot Radar only see a new version once its release has this file attached.
# "Run workflow" (Actions tab) builds a test copy you can download from the run's page instead.
name: Build installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # to attach the setup file to the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the release tag matches VERSION
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $tag = "${{ github.event.release.tag_name }}".TrimStart("v")
          if ($v -ne $tag) { throw "Release tag $tag doesn't match VERSION $v. Fix VERSION or the tag first." }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Python packages
        run: python -m pip install -r app/requirements.txt -r build/requirements-build.txt

      - name: Make sure Inno Setup is there
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build LootRadarSetup.exe
        shell: powershell
        run: .\build\build.ps1 -Python python -Out "$env:RUNNER_TEMP\lr"

      - name: Attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "${{ github.event.release.tag_name }}" "$env:RUNNER_TEMP\lr\dist\LootRadarSetup.exe" --clobber

      - name: Keep a copy on the run's page
        uses: actions/upload-artifact@v4
        with:
          name: LootRadarSetup
          path: ${{ runner.temp }}\lr\dist\LootRadarSetup.exe
